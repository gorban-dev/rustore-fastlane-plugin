# Publishes the gem to RubyGems when a GitHub release is published.
#
# Auth uses RubyGems Trusted Publishing (OIDC): no API key is stored in GitHub.
# The trusted publisher is configured on rubygems.org for repository
# gorban-dev/rustore-fastlane-plugin and workflow release.yml.
name: Publish gem

on:
  release:
    types: [published]
  # Manual retry, e.g. when the release run failed for reasons outside the code
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Run specs
        run: bundle exec rspec

      - name: Check that the tag matches the gem version
        if: github.event_name == 'release'
        run: |
          version=$(ruby -Ilib -e 'require "fastlane/plugin/rustore_publish/version"; print Fastlane::RustorePublish::VERSION')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Release tag $GITHUB_REF_NAME does not match gem version $version"
            exit 1
          fi

      # Exchanges the GitHub OIDC token for a short-lived RubyGems push key.
      # Done by hand because the first push of a new gem must name the owning
      # account (`owner`), and configure-rubygems-credentials has no such input.
      # The owner ID is shown on rubygems.org → Pending Trusted Publishers.
      - name: Get RubyGems API key (Trusted Publishing)
        env:
          RUBYGEMS_OWNER_ID: ${{ vars.RUBYGEMS_OWNER_ID }}
        run: |
          jwt=$(curl -sS --fail-with-body -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          echo "::add-mask::$jwt"
          response=$(curl -sS --fail-with-body -X POST https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token \
            --data-urlencode "jwt=$jwt" --data-urlencode "owner=$RUBYGEMS_OWNER_ID") || { echo "$response"; exit 1; }
          key=$(echo "$response" | jq -r .rubygems_api_key)
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"

      - name: Build and push
        run: |
          gem build fastlane-plugin-rustore_publish.gemspec
          gem push fastlane-plugin-rustore_publish-*.gem
